# Razorpay-WooCommerce webhook rig.
# Every image tag below was verified to exist on Docker Hub on 2026-08-23.
#   wordpress:6.9.4-php8.2-apache  created 2026-05-20  PHP_VERSION=8.2.31
#   mariadb:10.11.18               created 2026-08-18  (10.11 = MariaDB LTS)
#   wordpress:cli-php8.2           created 2026-07-30  WORDPRESS_CLI_VERSION=2.12.0, runs as www-data
#
# Version choice rationale (all first-party):
#   WordPress 6.9.4  <- razorpay-woocommerce readme.txt:5  "Tested up to: 6.9.4"
#   WooCommerce 10.6.2 (installed by setup.sh, not here)
#                    <- woo-razorpay.php:9  "WC tested up to: 10.6.2"
#   PHP 8.2          <- lowest PHP the wordpress:6.9.4 image publishes.
#                       Plugin floor is PHP 7.4 (readme.txt:7), so 8.2 is above the floor.

name: rzp-rig

services:
  db:
    image: mariadb:10.11.18
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # Host-loopback only. Lets you point a GUI client at 127.0.0.1:3307 if you want.
      - "127.0.0.1:3307:3306"
    healthcheck:
      # This is the same health command razorpay's own CI uses
      # (.github/workflows/unit-tests.yml:15).
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  wordpress:
    image: wordpress:6.9.4-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        /* Deterministic cron: nothing fires on page views. We drive it by hand
           with `wp cron event run rzp_webhook_exec_cron`. */
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FS_METHOD', 'direct');
    volumes:
      # Named volume for the WP tree: keeps thousands of core files OFF the
      # Windows bind-mount path (that is the #1 cause of a slow/broken rig).
      - wp_data:/var/www/html
      # Only the plugin under test crosses the Windows filesystem boundary.
      # Nested mount: this wins over wp_data for that subpath.
      - ./plugin/razorpay-woocommerce:/var/www/html/wp-content/plugins/razorpay-woocommerce
      # Second target. Mounted read-write like the first so wp-cli can activate it;
      # both are verified byte-identical to their pinned refs before every run.
      - ./plugin/razorpay-edd:/var/www/html/wp-content/plugins/razorpay-edd
    ports:
      - "8080:80"

  # wp-cli sidecar. Not started by `up` (profile-gated); invoked one-shot:
  #   docker compose run --rm -T cli wp plugin list
  cli:
    image: wordpress:cli-2.12.0-php8.2
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./plugin/razorpay-woocommerce:/var/www/html/wp-content/plugins/razorpay-woocommerce
      # Second target. Mounted read-write like the first so wp-cli can activate it;
      # both are verified byte-identical to their pinned refs before every run.
      - ./plugin/razorpay-edd:/var/www/html/wp-content/plugins/razorpay-edd
      # Rig helper scripts, read-only. setup.sh invokes them as `wp eval-file /rig/<x>.php`.
      - ./php:/rig:ro
    # The image already defaults to uid 33 (www-data); stated explicitly so the
    # files wp-cli creates are owned by the same user Apache runs as.
    user: "33:33"

  # Fake api.razorpay.com. Started only with:  docker compose --profile stub up -d rzpstub
  # Reuses the wordpress image (php 8.2 CLI is in it) so there is nothing extra to pull.
  # The mu-plugin php/mu-rig-api-base.php repoints the SDK at http://rzpstub:8000.
  rzpstub:
    image: wordpress:6.9.4-php8.2-apache
    profiles: ["stub"]
    restart: unless-stopped
    working_dir: /stub
    volumes:
      - ./stub:/stub:ro
    environment:
      RIG_WC_ORDER_ID: "${RIG_WC_ORDER_ID:-11}"
      RIG_RZP_ORDER_ID: "${RIG_RZP_ORDER_ID:-order_RIG00000000011}"
      RIG_AMOUNT_PAISE: "${RIG_AMOUNT_PAISE:-49900}"
    command: php -S 0.0.0.0:8000 /stub/router.php

volumes:
  db_data:
  wp_data:
